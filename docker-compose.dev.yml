version: '3.8'

services:
  resume:
    # Build locally from source
    build:
      context: .
      dockerfile: Dockerfile
    image: resume:local
    container_name: resume-app-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Optional: Set site password for authentication
      # - SITE_PASSWORD=your_secure_password_here
    restart: unless-stopped
    # Security options
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/pdf/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
