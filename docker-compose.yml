version: '3.8'

services:
  resume:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/jnuse/resume:latest
    container_name: resume-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Optional: Set site password for authentication
      # - SITE_PASSWORD=your_secure_password_here
    restart: unless-stopped
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits (optional, adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/pdf/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
